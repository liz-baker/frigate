name: test-validation
permissions:
  contents: read
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Deliberately does NOT check out submodules: frigate_audio_ucode (what
  # these tests exercise) has no dependency on libultraship-wiiu or the
  # decomp, and CMakeLists.txt only pulls libultraship-wiiu in via
  # add_subdirectory when external/libultraship-wiiu/CMakeLists.txt exists
  # -- so skipping the submodule checkout here keeps this job fast and
  # dependency-free instead of needing SDL3/tinyxml2 just to run unit tests
  # that don't touch either.
  test-linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.14
      with:
        key: ${{ runner.os }}-test-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-test-ccache-${{ github.ref }}
          ${{ runner.os }}-test-ccache-
    - name: Configure
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-test -GNinja -DCMAKE_BUILD_TYPE:STRING=Debug
    - name: Build
      run: cmake --build build-test --config Debug --parallel $(nproc)
    - name: Run tests
      run: ctest --test-dir build-test --output-on-failure
  verify-extract:
    # ROMs cannot be committed, so the extraction checks (the Python packers' archives against frigate-extract's, and
    # the texture decoder against the game's own code) run only where a runner holds a US ROM: set the repository
    # variable FRIGATE_ROMS_DIR to a directory on the runner host that contains one. With it unset the job is skipped
    # and the ROM-gated tests skip themselves in test-linux. This job needs the decomp (external/007) but not
    # libultraship.
    # Runs only for trusted refs: a self-hosted runner must never execute code from a fork's pull request.
    if: ${{ vars.FRIGATE_ROMS_DIR != '' && github.event_name != 'pull_request' }}
    runs-on: [self-hosted, Linux]
    container:
      image: catthehacker/ubuntu:full-latest
      options: --user root
      volumes:
        - ${{ vars.FRIGATE_ROMS_DIR }}:/roms:ro
    env:
      FRIGATE_ROMS: /roms
    steps:
    - uses: actions/checkout@v4
    - name: Fetch the decomp
      # See build-linux in build-validation.yml for why this is not checkout's own submodules input.
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        git config --global --add safe.directory "$PWD"
        git config --local --unset-all http.https://github.com/.extraheader || true
        find .git/modules -name config -exec git config -f {} --unset-all http.https://github.com/.extraheader \; 2>/dev/null || true
        AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')
        git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $AUTH"
        git submodule sync external/007
        git -c protocol.version=2 submodule update --init --force --depth=1 external/007
        git config --global --unset-all http.https://github.com/.extraheader
    - name: Configure
      run: cmake --no-warn-unused-cli -H. -Bbuild-verify -GNinja -DCMAKE_BUILD_TYPE:STRING=Debug
    - name: Build
      run: cmake --build build-verify --parallel $(nproc)
    - name: Run extraction checks
      # A ROM-gated test that skips here means the ROM was not found, which must fail this job rather than pass it.
      shell: bash
      run: |
        ctest --test-dir build-verify -R "Extract|Verify|Compare" --no-tests=error --output-on-failure | tee ctest.log
        ! grep -q "Skipped" ctest.log
  test-windows:
    runs-on: windows-latest
    steps:
    - name: Install dependencies
      run: choco install ninja
    - uses: actions/checkout@v4
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.14
      with:
        variant: sccache
        key: ${{ runner.os }}-test-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-test-ccache-${{ github.ref }}
          ${{ runner.os }}-test-ccache-
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Configure
      run: cmake --no-warn-unused-cli -S. -Bbuild-test -GNinja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Debug -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
    - name: Build
      run: cmake --build build-test --config Debug --parallel 10
    - name: Run tests
      run: ctest --test-dir build-test --output-on-failure
