name: release
# Pushing a tag like v1.2.3 builds Release packages for every desktop platform
# and the Wii U and attaches them to a GitHub release (docs/releasing.md). A
# manual run, or a PR that changes this file, builds the same packages as
# workflow artifacts without publishing.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  # Builds the packages when this workflow changes, to catch a break before a tag does.
  pull_request:
    paths: ['.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  # A branch name can't go in a file name, so a manual run is just "dev".
  VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
  # Release packages carry no developer launch arguments (src/dev/).
  RELEASE_CMAKE_FLAGS: -DCMAKE_BUILD_TYPE:STRING=Release -DFRIGATE_DEV_TOOLS=OFF
jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) libfuse2
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.14
      with:
        key: ${{ runner.os }}-release-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-release-ccache-
    - name: Install latest SDL
      run: |
        wget https://github.com/libsdl-org/SDL/releases/download/release-3.4.12/SDL3-3.4.12.tar.gz
        tar -xzf SDL3-3.4.12.tar.gz
        cmake -S SDL3-3.4.12 -B SDL3-3.4.12/build -GNinja -DCMAKE_BUILD_TYPE=Release
        cmake --build SDL3-3.4.12/build --parallel
        sudo cmake --install SDL3-3.4.12/build --prefix /usr/local
    - name: Install latest tinyxml2
      run: |
        wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
        tar -xzf 10.0.0.tar.gz
        cmake -S tinyxml2-10.0.0 -B tinyxml2-10.0.0/build -GNinja -DCMAKE_BUILD_TYPE=Release
        cmake --build tinyxml2-10.0.0/build --parallel
        sudo cmake --install tinyxml2-10.0.0/build
    - name: Build frigate
      run: |
        export PATH="/usr/lib/ccache:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja $RELEASE_CMAKE_FLAGS
        cmake --build build-cmake --config Release --parallel
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Package AppImage
      # The executable looks for f3d.o2r and gamecontrollerdb.txt next to
      # itself, so they go into usr/bin beside it.
      env:
        APPIMAGE_EXTRACT_AND_RUN: 1
        LD_LIBRARY_PATH: /usr/local/lib:/usr/local/lib/x86_64-linux-gnu
        LINUXDEPLOY_OUTPUT_VERSION: ${{ env.VERSION }}
      run: |
        mkdir -p AppDir/usr/bin
        cp build-cmake/frigate build-cmake/f3d.o2r build-cmake/gamecontrollerdb.txt AppDir/usr/bin/
        cp assets/wiiu/icon.png frigate.png
        cat > frigate.desktop <<'DESKTOP'
        [Desktop Entry]
        Type=Application
        Name=Frigate
        Comment=GoldenEye 007 port
        Exec=frigate
        Icon=frigate
        Categories=Game;
        DESKTOP
        wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
        chmod +x linuxdeploy-x86_64.AppImage
        ./linuxdeploy-x86_64.AppImage --appdir AppDir -e AppDir/usr/bin/frigate -d frigate.desktop -i frigate.png --output appimage
        mkdir dist
        mv Frigate*.AppImage "dist/frigate-${{ env.VERSION }}-linux-x86_64.AppImage"
    - uses: actions/upload-artifact@v4
      with:
        name: release-linux
        path: dist/*
        if-no-files-found: error

  macos:
    # Two single-architecture builds (Homebrew's libraries are not
    # multi-architecture), each with its dylibs bundled, then merged with lipo.
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install arm64 dependencies
      run: brew install $(cat .github/workflows/brew-deps.txt) dylibbundler
    - name: Install x86_64 dependencies
      # A second Homebrew under /usr/local, run through Rosetta.
      run: |
        softwareupdate --install-rosetta --agree-to-license || true
        NONINTERACTIVE=1 arch -x86_64 /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"
        arch -x86_64 /usr/local/bin/brew install $(cat .github/workflows/brew-deps.txt) dylibbundler
    - name: Build arm64
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-arm64 -GNinja $RELEASE_CMAKE_FLAGS \
          -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_PREFIX_PATH=/opt/homebrew -DCMAKE_IGNORE_PREFIX_PATH=/usr/local
        cmake --build build-arm64 --config Release --parallel
    - name: Build x86_64
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-x86_64 -GNinja $RELEASE_CMAKE_FLAGS \
          -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_PREFIX_PATH=/usr/local -DCMAKE_IGNORE_PREFIX_PATH=/opt/homebrew
        cmake --build build-x86_64 --config Release --parallel
    - name: Bundle libraries and merge
      run: |
        for arch in arm64 x86_64; do
          mkdir -p "stage-$arch"
          cp "build-$arch/frigate" "stage-$arch/frigate"
          bin=dylibbundler
          [ "$arch" = x86_64 ] && bin="arch -x86_64 /usr/local/bin/dylibbundler"
          (cd "stage-$arch" && $bin -od -b -x ./frigate -d ./libs -p @executable_path/libs)
        done
        out="frigate-${{ env.VERSION }}-macos-universal"
        mkdir -p "$out/libs"
        lipo -create stage-arm64/frigate stage-x86_64/frigate -output "$out/frigate"
        for lib in stage-arm64/libs/*.dylib; do
          name=$(basename "$lib")
          if [ -f "stage-x86_64/libs/$name" ]; then
            lipo -create "$lib" "stage-x86_64/libs/$name" -output "$out/libs/$name"
          else
            cp "$lib" "$out/libs/$name"
          fi
        done
        cp build-arm64/f3d.o2r build-arm64/gamecontrollerdb.txt "$out/"
        # Rewriting install names invalidates signatures; arm64 refuses unsigned code.
        codesign --force --sign - "$out"/libs/*.dylib "$out/frigate"
        mkdir dist
        ditto -c -k --keepParent "$out" "dist/$out.zip"
    - uses: actions/upload-artifact@v4
      with:
        name: release-macos
        path: dist/*
        if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
    - name: Install dependencies
      run: |
        choco install ninja
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.14
      with:
        variant: sccache
        key: ${{ runner.os }}-release-ccache-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-release-ccache-
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build frigate
      env:
        VCPKG_ROOT: D:/a/vcpkg
      run: |
        cmake --no-warn-unused-cli -S. -Bbuild-cmake-x64 -GNinja -DCMAKE_MAKE_PROGRAM=ninja ${{ env.RELEASE_CMAKE_FLAGS }} -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DUSE_AUTO_VCPKG=ON -DCMAKE_VS_PLATFORM_NAME=x64
        cmake --build build-cmake-x64 --config Release --parallel 10
    - name: Package
      shell: pwsh
      run: |
        $name = "frigate-${{ env.VERSION }}-windows-x64"
        New-Item -ItemType Directory -Force -Path "$name" | Out-Null
        Copy-Item build-cmake-x64/frigate.exe, build-cmake-x64/f3d.o2r, build-cmake-x64/gamecontrollerdb.txt "$name/"
        Copy-Item build-cmake-x64/*.dll "$name/" -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Compress-Archive -Path "$name" -DestinationPath "dist/$name.zip"
    - uses: actions/upload-artifact@v4
      with:
        name: release-windows
        path: dist/*
        if-no-files-found: error

  wiiu:
    runs-on: ubuntu-22.04
    container:
      image: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Wii U dependencies
      run: |
        PKGS="wiiu-cmake wiiu-pkg-config ppc-tinyxml2 ppc-libzip ppc-zlib ppc-bzip2"
        for attempt in 1 2 3 4 5; do
          if dkp-pacman -Syu --needed --noconfirm $PKGS; then
            exit 0
          fi
          sleep $((attempt * 15))
        done
        exit 1
    - name: Install build tools
      # frigate-pack-shaders is built for the build machine, not the console.
      run: dpkg -s zlib1g-dev >/dev/null 2>&1 || { apt-get update && apt-get install -y zlib1g-dev zip; }
    - name: Build frigate for Wii U
      run: |
        source /etc/profile.d/devkit-env.sh || true
        export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
        cmake --no-warn-unused-cli -S. -Bbuild-wiiu -GNinja \
          -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/WiiU.cmake $RELEASE_CMAKE_FLAGS
        cmake --build build-wiiu --config Release --target frigate_wuhb --parallel
    - name: Package
      # Extracts to the root of the SD card, landing in /wiiu/apps/frigate/.
      run: |
        mkdir -p stage/wiiu/apps/frigate dist
        cp build-wiiu/frigate.wuhb stage/wiiu/apps/frigate/
        (cd stage && zip -r "../dist/frigate-${{ env.VERSION }}-wiiu.zip" wiiu)
    - uses: actions/upload-artifact@v4
      with:
        name: release-wiiu
        path: dist/*
        if-no-files-found: error

  publish:
    if: github.ref_type == 'tag'
    needs: [linux, macos, windows, wiiu]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: release-*
        path: dist
        merge-multiple: true
    - name: Create the release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        (cd dist && sha256sum * > SHA256SUMS.txt)
        prerelease=""
        case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
        gh release create "$GITHUB_REF_NAME" $prerelease --verify-tag --title "$GITHUB_REF_NAME" --generate-notes dist/*
