  build-windows-arm64:
    runs-on: windows-2022
    steps:
      - name: Install dependencies
        run: |
          choco install ninja
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          variant: sccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}
            ${{ runner.os }}-ccache-
      - name: Cache build folder
        uses: actions/cache@v6
        with:
          save-always: true
          key: ${{ runner.os }}-build-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ github.ref }}
            ${{ runner.os }}-build-
          path: |
            build-cmake-arm64
            D:/a/vcpkg
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build frigate
        env:
          VCPKG_ROOT: D:/a/vcpkg
        run: |
          cmake --no-warn-unused-cli -S. -Bbuild-cmake-arm64 -G "Visual Studio 17 2022" -T v143 -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DUSE_AUTO_VCPKG=ON -DCMAKE_VS_PLATFORM_NAME=arm64
          cmake --build build-cmake-arm64 --config Release --parallel 10
  build-wiiu:
    runs-on: ubuntu-22.04
    # The official devkitPro image ships the devkitPPC/wut toolchain and the
    # WiiU CMake toolchain file used to cross-compile for the console. This
    # builds frigate itself for Wii U and packages it as a .wuhb.
    container:
      image: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v7
      with:
        submodules: recursive
    - name: Install Wii U dependencies
      run: |
        PKGS="wiiu-cmake wiiu-pkg-config ppc-tinyxml2 ppc-libzip ppc-zlib ppc-bzip2"
        if dkp-pacman -S --needed --noconfirm $PKGS; then
          exit 0
        fi
        echo "Install without DB sync failed; falling back to synced install"
        for attempt in 1 2 3 4 5; do
          if dkp-pacman -Syu --needed --noconfirm $PKGS; then
            exit 0
          fi
          echo "dkp-pacman sync attempt $attempt failed; retrying in $((attempt * 15))s"
          sleep $((attempt * 15))
        done
        echo "dkp-pacman failed after retries" >&2
        exit 1
    - name: Install build tools
      # frigate-pack-shaders is built for the build machine (not the console) and
      # needs its zlib; the ppc-zlib above only covers the Wii U target.
      run: |
        dpkg -s zlib1g-dev >/dev/null 2>&1 || { apt-get update && apt-get install -y zlib1g-dev; }
    - name: Build frigate for Wii U
      run: |
        source /etc/profile.d/devkit-env.sh || true
        export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
        cmake --no-warn-unused-cli -S. -Bbuild-wiiu -GNinja \
          -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/WiiU.cmake \
          -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-wiiu --config Release --target frigate_wuhb --parallel