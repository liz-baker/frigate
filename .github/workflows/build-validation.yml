name: build-validation
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-linux:
    runs-on: [self-hosted, Linux]
    # Runs in a container so this job needs nothing but Docker on the host
    # -- the image mirrors GitHub's hosted ubuntu-latest toolset (git,
    # cmake, ninja, gcc-12/g++-12, etc.) instead of depending on whatever
    # happens to be installed on whichever self-hosted runner picks it up.
    # --user root: the image's default non-root "runner" user (uid 1001)
    # can't write into the self-hosted runner's _work/_temp bind mounts,
    # which are owned by whichever host user the runner service runs as.
    container:
      image: catthehacker/ubuntu:full-latest
      options: --user root
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt)
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.14
      with:
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache-
    - name: Install latest SDL
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        wget https://github.com/libsdl-org/SDL/releases/download/release-3.4.12/SDL3-3.4.12.tar.gz
        tar -xzf SDL3-3.4.12.tar.gz
        cmake -S SDL3-3.4.12 -B SDL3-3.4.12/build -GNinja -DCMAKE_BUILD_TYPE=Release
        cmake --build SDL3-3.4.12/build --parallel 10
        sudo cmake --install SDL3-3.4.12/build --prefix /usr/local
    - name: Install latest tinyxml2
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        wget https://github.com/leethomason/tinyxml2/archive/refs/tags/10.0.0.tar.gz
        tar -xzf 10.0.0.tar.gz
        cd tinyxml2-10.0.0
        mkdir build
        cd build
        cmake ..
        make
        sudo make install
    - name: Build frigate
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-cmake --config Release --parallel 10
      env:
        CC: gcc-12
        CXX: g++-12
    - name: Upload frigate binary
      uses: actions/upload-artifact@v4
      with:
        name: frigate-linux
        path: |
          build-cmake/frigate
          build-cmake/f3d.o2r
    - name: Deinit submodules
      # Self-hosted runners reuse the same _work checkout across jobs
      # (unlike GitHub's ephemeral hosted VMs). Once a submodule is
      # checked out here, git treats it as "active" and future checkouts
      # on other jobs (e.g. test-linux, which deliberately runs without
      # submodules) won't clean it back out -- leaving stale submodule
      # content that can silently change what those jobs build against.
      # Deinit here so this job leaves the shared workspace as it found it.
      if: always()
      run: git -c safe.directory="$PWD" submodule deinit -f --all
  build-macos:
    # Runs on a self-hosted macOS runner (no Actions minutes cost), so this
    # fires on every push/PR like build-linux.
    runs-on: [self-hosted, macOS]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        brew install $(cat .github/workflows/brew-deps.txt)
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.14
      with:
        key: ${{ runner.os }}-mac-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-mac-ccache-${{ github.ref }}
          ${{ runner.os }}-mac-ccache-
    - name: Build frigate
      run: |
        export PATH="/usr/lib/ccache:/usr/local/opt/ccache/libexec:$PATH"
        cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-cmake --config Release --parallel 10
    - name: Upload frigate binary
      uses: actions/upload-artifact@v4
      with:
        name: frigate-macos
        path: |
          build-cmake/frigate
          build-cmake/f3d.o2r
    - name: Deinit submodules
      # See build-linux: self-hosted runners reuse the same _work checkout
      # across jobs, so leave the shared workspace as this job found it.
      if: always()
      run: git -c safe.directory="$PWD" submodule deinit -f --all
  build-windows-x64:
    runs-on: [self-hosted, Windows]
    steps:
    - name: Install dependencies
      run: |
        choco install ninja
        Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.14
      with:
        variant: sccache
        key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-ccache-${{ github.ref }}
          ${{ runner.os }}-ccache-
    - name: Cache build folder
      uses: actions/cache@v4
      with:
        save-always: true
        key: ${{ runner.os }}-build-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-build-${{ github.ref }}
          ${{ runner.os }}-build-
        path: |
          build-cmake-x64
          ${{ github.workspace }}/vcpkg
    - name: Setup MSVC
      uses: ilammy/msvc-dev-cmd@v1
    - name: Build frigate
      env:
        # D:/a/vcpkg mirrors the GitHub-hosted windows-latest work-folder
        # layout, which this self-hosted runner doesn't have (its work
        # folder is under C:\gh-actions-runner\_work) -- caching vcpkg
        # inside the checkout keeps it on whatever drive the runner
        # actually uses.
        VCPKG_ROOT: ${{ github.workspace }}/vcpkg
      run: |
        cmake --no-warn-unused-cli -S. -Bbuild-cmake-x64 -GNinja -DCMAKE_MAKE_PROGRAM=ninja -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DUSE_AUTO_VCPKG=ON -DCMAKE_VS_PLATFORM_NAME=x64
        cmake --build build-cmake-x64 --config Release --parallel 10
    - name: Deinit submodules
      # See build-linux: self-hosted runners reuse the same _work checkout
      # across jobs (now including test-windows, which deliberately runs
      # without submodules), so leave the shared workspace as this job
      # found it.
      if: always()
      run: git submodule deinit -f --all
  build-ios:
    # Mobile build, not part of the routine local self-hosted testing --
    # manual-trigger only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, macOS]
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        brew install $(cat .github/workflows/brew-deps.txt)
    - name: Cache build folder
      uses: actions/cache@v4
      with:
        save-always: true
        # Keyed with a "self-hosted" prefix (rather than reusing the old
        # "14-ios-build" key from the cloud macos-14 runner) so this never
        # restores a cache whose CMakeCache.txt has the cloud runner's
        # absolute build path baked in -- CMake refuses to reuse a build
        # directory whose recorded source/binary paths don't match the
        # current checkout path, which differs between runners.
        key: ${{ runner.os }}-self-hosted-ios-build-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-self-hosted-ios-build-${{ github.ref }}
          ${{ runner.os }}-self-hosted-ios-build-
        path: |
          build-cmake-ios
    - name: Build frigate
      run: |
        cmake --no-warn-unused-cli -H. -Bbuild-cmake-ios -GXcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=14.0 -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-cmake-ios --config Release --parallel 10
  build-android:
    # Mobile build, not part of the routine local self-hosted testing --
    # manual-trigger only.
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, Linux]
    env:
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk/android-ndk-r29
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y $(cat .github/workflows/apt-deps.txt) unzip curl
    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2.14
      with:
        key: ${{ runner.os }}-android-ccache-${{ github.ref }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-android-ccache-${{ github.ref }}
          ${{ runner.os }}-android-ccache-
    - name: Install Android NDK
      run: |
        curl -L https://dl.google.com/android/repository/android-ndk-r29-linux.zip -o android-ndk.zip
        unzip -q android-ndk.zip
        mkdir -p android-ndk
        mv android-ndk-r29 android-ndk/
    - name: Configure frigate for Android
      run: |
        cmake --no-warn-unused-cli -S . -Bbuild-cmake-android -GNinja \
          -DCMAKE_BUILD_TYPE:STRING=Release \
          -DCMAKE_SYSTEM_NAME=Android \
          -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
          -DANDROID_NDK=${ANDROID_NDK_HOME} \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=latest \
          -DANDROID_STL=c++_static
    - name: Build frigate for Android
      run: |
        cmake --build build-cmake-android --config Release --parallel 10
  build-windows-arm64:
    # No self-hosted Windows runner yet -- still a cloud runner, so this
    # stays manual-trigger only to stay within the Actions minutes quota.
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-2022
    steps:
      - name: Install dependencies
        run: |
          choco install ninja
          Remove-Item -Path "C:\ProgramData\Chocolatey\bin\ccache.exe" -Force -ErrorAction SilentlyContinue
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.14
        with:
          variant: sccache
          key: ${{ runner.os }}-ccache-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ccache-${{ github.ref }}
            ${{ runner.os }}-ccache-
      - name: Cache build folder
        uses: actions/cache@v4
        with:
          save-always: true
          key: ${{ runner.os }}-build-${{ github.ref }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-${{ github.ref }}
            ${{ runner.os }}-build-
          path: |
            build-cmake-arm64
            D:/a/vcpkg
      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
      - name: Build frigate
        env:
          VCPKG_ROOT: D:/a/vcpkg
        run: |
          cmake --no-warn-unused-cli -S. -Bbuild-cmake-arm64 -G "Visual Studio 17 2022" -T v143 -DCMAKE_BUILD_TYPE:STRING=Release -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache -DUSE_AUTO_VCPKG=ON -DCMAKE_VS_PLATFORM_NAME=arm64
          cmake --build build-cmake-arm64 --config Release --parallel 10
  build-wiiu:
    runs-on: [self-hosted, Linux]
    # The official devkitPro image ships the devkitPPC/wut toolchain and the
    # WiiU CMake toolchain file used to cross-compile for the console. This
    # only builds libultraship-wiiu itself (via WiiU.cmake) rather than
    # frigate's own root CMakeLists.txt, since frigate's own code doesn't
    # have any Wii U-specific targets to cross-compile yet.
    container:
      image: devkitpro/devkitppc:latest
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Install Wii U dependencies
      run: |
        PKGS="wiiu-cmake wiiu-pkg-config ppc-tinyxml2 ppc-libzip ppc-zlib ppc-bzip2"
        if dkp-pacman -S --needed --noconfirm $PKGS; then
          exit 0
        fi
        echo "Install without DB sync failed; falling back to synced install"
        for attempt in 1 2 3 4 5; do
          if dkp-pacman -Syu --needed --noconfirm $PKGS; then
            exit 0
          fi
          echo "dkp-pacman sync attempt $attempt failed; retrying in $((attempt * 15))s"
          sleep $((attempt * 15))
        done
        echo "dkp-pacman failed after retries" >&2
        exit 1
    - name: Build libultraship-wiiu for Wii U
      run: |
        source /etc/profile.d/devkit-env.sh || true
        export DEVKITPRO=${DEVKITPRO:-/opt/devkitpro}
        cmake --no-warn-unused-cli -Hexternal/libultraship-wiiu -Bbuild-wiiu -GNinja \
          -DCMAKE_TOOLCHAIN_FILE=$DEVKITPRO/cmake/WiiU.cmake \
          -DCMAKE_BUILD_TYPE:STRING=Release
        cmake --build build-wiiu --config Release --parallel
    - name: Fix workspace permissions for later jobs
      # This job runs in a container as root, so build-wiiu/ ends up
      # root-owned on the runner's shared host checkout. Other jobs on the
      # same self-hosted runner (e.g. build-linux) check out into the same
      # workspace as a non-root user and fail to clean it on their next run
      # ("Permission denied" removing these files) unless it's made
      # removable here first.
      if: always()
      run: chmod -R a+rwX . || true
    - name: Deinit submodules
      # See build-linux: self-hosted runners reuse the same _work checkout
      # across jobs, so leave the shared workspace as this job found it.
      if: always()
      run: git -c safe.directory="$PWD" submodule deinit -f --all
