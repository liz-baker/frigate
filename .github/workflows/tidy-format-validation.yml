name: tidy-format-validation
on: [pull_request]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: [self-hosted, Linux]
    # See build-linux in build-validation.yml: runs in a container so this
    # job doesn't depend on whatever's installed on the host runner.
    container:
      image: catthehacker/ubuntu:full-latest
      options: --user root
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-14
      - name: Run clang-format
        run: |
          find src tests -name "*.cpp" -o -name "*.h" | sed 's| |\\ |g' | xargs clang-format-14 -i
          git diff --exit-code
